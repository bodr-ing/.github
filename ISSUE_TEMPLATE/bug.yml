name: Bug
description: Something is broken or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Click...\n3. See..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Build, version or commit
  - type: textarea
    id: media
    attributes:
      label: Screenshots or logs
      description: Remove any keys, tokens or personal data before pasting.
